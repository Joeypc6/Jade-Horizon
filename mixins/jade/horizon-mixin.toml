[mod]
id = "jade"
version = "26.3.5"
priority = 100

# The Horizon commit this bundle was built and tested on.
[compatibility]
horizon_revision = "6475f62f3c834b7489e1816bf47f47ea5eb2b879"

# Jade (snownee.jade, Jade-mc26.3-Fabric-26.3.5): the look-at overlay and its plugin registry.
[[module]]
id = "jade"
file = "crates/horizon-client/src/game.rs"
name = "jade"
source = "jade.rs"

# Jade's themes (ThemeHelper): jade_themes/**.json, the jar's and the resource root's.
[[module]]
id = "jade-theme"
file = "crates/horizon-client/src/game.rs"
name = "jade_theme"
source = "jade_theme.rs"

# Jade's config screens (HomeConfigScreen, WailaConfigScreen, PluginsConfigScreen, ProfileConfigScreen).
[[module]]
id = "jade-config"
file = "crates/horizon-client/src/game.rs"
name = "jade_config"
source = "jade_config.rs"

# BlockDisplayProvider and ItemDisplayProvider: what a display shows is private to its file.
[[module]]
id = "display-access"
file = "crates/horizon-client/src/game/text_displays.rs"
name = "hz_jade_displays"
source = "display_access.rs"

# NextEntityDropProvider: a sniffer's sniff_cooldown memory, whose time is private to its file.
[[module]]
id = "brain-ttl"
file = "crates/horizon-client/src/mobs/animal_brain.rs"
name = "hz_jade_brain"
source = "brain_ttl.rs"

[[injection]]
id = "hud"
kind = "HEAD"
hook = "hud"
hook_version = 1
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "net-from-client"
kind = "HEAD"
hook = "net_from_client"
hook_version = 1
helper = "net_from_client.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

[[injection]]
id = "net-from-server"
kind = "HEAD"
hook = "net_from_server"
hook_version = 1
helper = "net_from_server.rs"
bindings = [
  { name = "channel", ty = "&str", value = "channel" },
  { name = "data", ty = "&[u8]", value = "data" },
]

# Jade in Options > Mods: its keys (JadeKeys) and its options page (WailaConfigScreen).
[[injection]]
id = "list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "settings_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

# Boss Bar Overlap's Hide Boss Bar.
[[injection]]
id = "hide-boss-bars"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::dragon::Game<'_>::draw_boss_bars"
helper = "hide_boss_bars.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
]

# Mod Name on Item Tooltip.
[[injection]]
id = "item-mod-name"
kind = "RETURN"
target = "horizon_client::game::stations::Game<'_>::stack_tooltip"
helper = "item_mod_name.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "lines", ty = "Vec<(horizon_client::text::Text, u32)>", value = "$value" },
]

# /jadec and /jade.
[[injection]]
id = "jade-command"
kind = "HEAD"
hook = "command"
hook_version = 1
helper = "jade_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "jade-perform-command"
kind = "HEAD"
hook = "perform_command"
hook_version = 1
helper = "jade_perform_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "jade-register-commands"
kind = "HEAD"
hook = "register_commands"
hook_version = 1
helper = "jade_register_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

# The config screens: drawn and worked through the screen hooks, on the mod's own screen and over Options.
[[injection]]
id = "config-frame"
kind = "HEAD"
hook = "frame"
hook_version = 1
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "config-render-post"
kind = "HEAD"
hook = "screen_render_post"
hook_version = 1
helper = "screen_render_post.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "&*screen" },
]

[[injection]]
id = "config-mouse-pressed"
kind = "HEAD"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
helper = "screen_pressed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "&*screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "config-mouse-released"
kind = "HEAD"
hook = "screen_mouse_button_released_pre"
hook_version = 1
helper = "screen_released.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "&*screen" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "config-mouse-scrolled"
kind = "HEAD"
hook = "screen_mouse_scrolled_pre"
hook_version = 1
helper = "screen_scrolled.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "&*screen" },
  { name = "scroll", ty = "[f64; 2]", value = "scroll" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "config-key-pressed"
kind = "HEAD"
hook = "screen_key_pressed_pre"
hook_version = 1
helper = "screen_key.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "&*screen" },
  { name = "key", ty = "&str", value = "key" },
  { name = "repeat", ty = "bool", value = "repeat" },
  { name = "modifiers", ty = "u32", value = "modifiers" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "config-char-typed"
kind = "HEAD"
hook = "screen_char_typed_pre"
hook_version = 1
helper = "screen_typed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&crate::game::native_hooks::NativeScreenView<'_>", value = "&*screen" },
  { name = "c", ty = "char", value = "c" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# The themes are read again with the resources.
[[injection]]
id = "themes-reloaded"
kind = "HEAD"
hook = "client_resources_reloaded"
hook_version = 1
helper = "resources_reloaded.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "jade-perform-console"
kind = "HEAD"
hook = "perform_console_command"
hook_version = 1
helper = "jade_perform_console.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# Jade.registerGameRules: jade:max_position_deviation, an integer in MISC, 21, 0 to 1000.
[[module]]
id = "gamerule"
file = "crates/horizon-client-core/src/gamerules.rs"
name = "hz_jade_rule"
source = "gamerule.rs"
visibility = "pub"

[[injection]]
id = "gamerule-lookup"
kind = "HEAD"
cancellable = true
target = "horizon_client_core::gamerules::rule"
helper = "rule_lookup.rs"
bindings = [
  { name = "name", ty = "&str", value = "name" },
]

# The value reaches Level.write through level.game_rules, which it writes only vanilla's rules of.
[[injection]]
id = "gamerule-by-name"
kind = "RETURN"
target = "horizon_client_core::gamerules::GameRules::by_name"
helper = "rule_by_name.rs"
bindings = [
  { name = "rules", ty = "&GameRules", value = "&*self" },
  { name = "value", ty = "BTreeMap<String, i32>", value = "$value" },
]

[[injection]]
id = "gamerule-save"
kind = "HEAD"
target = "horizon_client_lib::save::Level::write_internal"
helper = "rule_save.rs"
bindings = [
  { name = "level", ty = "&Level", value = "&*self" },
  { name = "dir", ty = "&Path", value = "dir" },
]

[[injection]]
id = "gamerule-world-opening"
kind = "HEAD"
target = "horizon_client::game::chat::Game<'_>::load_world_state"
helper = "rule_world_opening.rs"

[[injection]]
id = "gamerule-level-opened"
kind = "HEAD"
target = "horizon_client::game::levels::Game<'_>::native_level_opened"
helper = "rule_level_opened.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# /gamerule and its event line, whose key says minecraft: for Horizon's own rules.
[[injection]]
id = "gamerule-set"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::commands::Game<'_>::set_game_rule"
helper = "rule_set.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "rule", ty = "&gamerules::Rule", value = "rule" },
  { name = "value", ty = "Value", value = "value" },
]

[[injection]]
id = "gamerule-command-tree"
kind = "RETURN"
target = "horizon_command::vanilla::build_for_features"
helper = "rule_command_tree.rs"
bindings = [
  { name = "value", ty = "Dispatcher", value = "$value" },
]

[[injection]]
id = "gamerule-guest-tree"
kind = "HEAD"
target = "horizon_client_lib::lan::commands::fill"
helper = "rule_guest_tree.rs"
bindings = [
  { name = "target", ty = "usize", value = "target" },
  { name = "path", ty = "&Vec<String>", value = "&*path" },
  { name = "nodes", ty = "&mut Vec<Node>", value = "&mut *nodes" },
  { name = "paths", ty = "&mut HashMap<Vec<String>, usize>", value = "&mut *paths" },
]

# ClientboundGameRuleValuesPacket: the guest's Game Rules screen opens on what this lists.
[[injection]]
id = "gamerule-values"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::lan_actions::Game<'_>::lan_guest_packet"
helper = "rule_values.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "host", ty = "&mut LanHost", value = "&mut *host" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "packet", ty = "&S", value = "&packet" },
]

# AbstractGameRulesScreen: `build` returns Self, which a hook can't, so the number box comes when it's first asked for.
[[injection]]
id = "gamerule-screen-rows"
kind = "RETURN"
target = "horizon_client_lib::game_rules_screen::RulesScreen::rows"
helper = "rule_rows.rs"
bindings = [
  { name = "screen", ty = "&RulesScreen", value = "&*self" },
  { name = "value", ty = "Vec<Row>", value = "$value" },
]

[[injection]]
id = "gamerule-screen-number"
kind = "HEAD"
target = "horizon_client_lib::game_rules_screen::RulesScreen::number"
helper = "rule_number.rs"
bindings = [
  { name = "screen", ty = "&mut RulesScreen", value = "&mut *self" },
  { name = "name", ty = "&str", value = "name" },
]

[[injection]]
id = "gamerule-screen-changes"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::game_rules_screen::RulesScreen::changes"
helper = "rule_changes.rs"
bindings = [
  { name = "screen", ty = "&RulesScreen", value = "&*self" },
]

[[injection]]
id = "gamerule-screen-name"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::game_rules_screen::name_key"
helper = "rule_name_key.rs"
bindings = [
  { name = "r", ty = "&Rule", value = "r" },
]
